 task:[{k:'c',t:'Процестерді екі бағанға орналастырыңыз:',cols:['Қайтымды (идеал модель)','Қайтымсыз'],it:[['Үйкелісі жоқ маятниктің тербелісі',0],['Үйкеліссіз серіппенің тербелісі',0],['Ыстық шайдың бөлмеде суынуы',1],['Бөлмеде мұздың еруі',1],['Секіріп жатқан доптың тоқтауы',1],['Шайда қанттың еруі және өздігінен бөлінбеуі',1]],e:'Қайтымсыз процестер өздігінен тек бір бағытта жүреді. Үйкелісі жоқ тербеліс — идеал модель.'},
 M('Бөлмеде мұз ериді. Су бөлмеде өздігінен қатып, мұзға айнала ма?',['Иә, өздігінен қатады','Жоқ, қатуы үшін жылуды алып кететін құрал (мысалы, тоңазытқыш) және сыртқы жұмыс қажет','Тек түнде қатады','Тек ыдыс үлкен болса қатады'],1,'Бөлмеде мұздың еруі өздігінен жүреді, ал кері процесс үшін тоңазытқыштың жұмысы керек.'),

 def:[M('Қорғау: ыстық шай неге өздігінен қызбайды?',['Кері процесс энергияның сақталу заңына қайшы','Кері процесс өздігінен жүрмейді: жылу өздігінен суық денеден ыстыққа берілмейді','Шайдың энергиясы жоқ','Бөлме ауасы жылу бере алмайды'],1,'Энергияның сақталу заңына кері процесс қайшы келмейді. Процестің бағытын термодинамиканың екінші заңы анықтайды.')]},
{n:'2-топ',h:'«Клаузиус зертханасы»',top:'Термодинамиканың екінші заңы. Клаузиус тұжырымдамасы',

 task:[{k:'c',t:'Тұжырымдар Клаузиус тұжырымдамасына сәйкес пе?',cols:['Сәйкес','Сәйкес емес'],it:[['Жылу өздігінен ыстық денеден суық денеге беріледі',0],['Жылу өздігінен суық денеден ыстық денеге беріледі',1],['Тоңазытқышта жылу суық камерадан бөлмеге электр жұмысы арқылы беріледі',0],['Сыртқы жұмыссыз суық дене ыстық денені қыздыра алады',1],['Температуралары теңескен денелер өздігінен қайтадан ыстық және суық болып ажырайды',1],['Жылу алмасу температуралар теңескенше жүреді',0]],e:'Клаузиус бойынша кері бағыттағы жылу беру тек сыртқы жұмыс арқылы мүмкін.'},

 task:[M('Доп құлаған кезде оның жылдамдығы қалай өзгереді?',['Артады','Азаяды','Өзгермейді','Нөлге тең'],0,'Еркін құлауда жылдамдық v = gt заңымен артады.'),
 M('Доптың кинетикалық энергиясы қай кезде артады?',['Төмен қозғалғанда (құлағанда)','Ең жоғарғы нүктеде','Тыныштықта тұрғанда','Тек секіргенде'],0,'Құлағанда биіктік азаяды, потенциалдық энергия кинетикалыққа айналады.'),
 M('Неліктен әр секірген сайын көтерілу биіктігі азаяды?',['Доптың массасы азаяды','Соқтығыста механикалық энергияның бір бөлігі ішкі энергияға және дыбысқа айналады','Энергия жоғалып кетеді','Ауырлық күші артады'],1,'Энергия жоғалмайды, ол ішкі энергияға және дыбысқа айналады.'),
 M('Механикалық энергияның бір бөлігі қандай энергия түрлеріне айналады?',['Ішкі энергия және дыбыс','Тек потенциалдық энергия','Жарық энергиясы ғана','Ештеңеге айналмайды'],0,'Доп пен еден қызады (ішкі энергия), дыбыс шығады.'),

 {k:'o',t:'Доптың қозғалыс кезеңдерін дұрыс ретпен орналастырыңыз:',it:['Потенциалдық энергия','Еркін құлау','Кинетикалық энергияның артуы','Еденмен соқтығысу','Энергияның бір бөлігінің ішкі энергияға және дыбысқа айналуы','Қайта көтерілу','Секіру биіктігінің азаюы'],e:'Реті: энергия → құлау → Ek артуы → соқтығыс → ішкі энергия мен дыбыс → көтерілу → биіктіктің азаюы.'}],
 def:[M('Неліктен тәжірибе нәтижесін бұрмаламай көрсету маңызды?',['Әділ баға алу үшін','Сенімді білім тек нақты өлшемдерге негізделеді','Мұғалім сұрағандықтан','Маңызды емес'],1,'Нақты өлшем — сенімді қорытындының негізі.'),
 M('Ғылыми зерттеуде жауапкершілік не үшін қажет?',['Нәтиже адамдарға зиян келтірмей, шындықты көрсету үшін','Тез аяқтау үшін','Жұмысты көшіру үшін','Қажет емес'],0,'Жауапкершілік деректердің шынайылығын және нәтижені дұрыс қолдануды қамтамасыз етеді.'),

const ST=G.map(g=>({r:{},ord:{},tx:'',ck:[0,0,0]}));

<div class="cd"><h3>Құндылық: «Әділдік және жауапкершілік»</h3><div class="qt">«Жауапкершілік адамды адам етеді»</div><p>Табиғат заңдарын түсіну — жауапкершіліктің бастауы. Энергия жоғалмайды, бірақ пайдалы түрден тарап кетеді: оны үнемдеп, ақылмен пайдалану — біздің жауапкершілігіміз. Зерттеуде нәтижелерді өзгертпей, шынайы тіркеу — әділдіктің көрінісі.</p></div>
<div class="cd"><h3>Екінші заңның екі тұжырымдамасы</h3><p><b>Клаузиус:</b> жылу өздігінен ыстық денеден суық денеге беріледі; кері бағытта сыртқы жұмыссыз өздігінен берілмейді.</p><p><b>Кельвин:</b> периодты жұмыс істейтін жылу қозғалтқышында алынған жылудың барлығын жұмысқа айналдыру мүмкін емес.</p><div class="tb"><button onclick="cur=0;show()">1-топтан бастау</button></div></div>`}
